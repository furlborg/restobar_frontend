stages:
  - demo

demo:
  image: ubuntu:latest
  stage: demo
  only:
    - demo
  before_script:
    - 'which sshpass || (apt-get update -y && apt-get install sshpass -y)'
    - mkdir -p ~/.ssh
    - ssh-keyscan -H ${SSH_HOST_DEDICADO} >> ~/.ssh/known_hosts
  script:
    - sshpass -p "${SSH_PASSWORD_DEDICADO}" ssh ${SSH_USER}@${SSH_HOST_DEDICADO} " cd /home/tsi/ci/ && export NVM_DIR=~/.nvm && source ~/.nvm/nvm.sh && . update_demo_flizzy_front && exit"